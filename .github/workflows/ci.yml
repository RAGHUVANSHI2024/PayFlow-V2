name: PayFlow CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: payflow_auth
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - wallet-service
          - user-service
          - notification-service
          - gateway-service
          - saga-service
          - config-server
          - discovery-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Create Test Databases
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -pmysql -e "
            CREATE DATABASE IF NOT EXISTS payflow_auth;
            CREATE DATABASE IF NOT EXISTS payflow_user;
            CREATE DATABASE IF NOT EXISTS payflow_wallet;
            CREATE DATABASE IF NOT EXISTS payflow_notification;
          "

      - name: Build and Verify Project
        working-directory: ${{ matrix.service }}
        run: mvn --batch-mode clean verify


  publish:
    name: Publish ${{ matrix.image }} to GHCR
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - context: auth-service
            image: payflow-auth
          - context: user-service
            image: payflow-user
          - context: wallet-service
            image: payflow-wallet
          - context: notification-service
            image: payflow-notification
          - context: gateway-service
            image: payflow-gateway
          - context: saga-service
            image: payflow-saga
          - context: config-server
            image: payflow-config
          - context: discovery-server
            image: payflow-eureka

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/raghuvanshi2024/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
